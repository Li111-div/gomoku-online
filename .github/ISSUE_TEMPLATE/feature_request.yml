name: 功能建议
description: 提出一个新功能或改进
title: '[建议] '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        **先描述问题，再描述方案。** 很多时候我们能用更简单的方式解决同一个问题。
        涉及架构改动的建议，请先在这里讨论清楚再动手写代码。

  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      description: 描述你的使用场景和遇到的困难，而不是直接给方案
      placeholder: |
        我和朋友玩的时候，中途想去倒杯水，回来发现对方已经等得不耐烦走了。
        希望能有个「暂时离开」的提示。
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 你设想的方案
      description: 如果有具体想法，写在这里

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的其他方案
      description: 以及为什么你觉得它们不如你的方案

  - type: checkboxes
    id: scope
    attributes:
      label: 影响面确认
      options:
        - label: 这个改动不需要引入第三方依赖（服务端要保持零依赖）
        - label: 这个改动不会把棋局判定逻辑挪回客户端
        - label: 如果涉及消息协议变更，我愿意同步修改前后端两侧
